name: keepalive
on:
  schedule:
    - cron: "0 3 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          URL=$(printf '%s' "$SUPABASE_URL" | tr -d ' \r\n"')
          KEY=$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d ' \r\n"')
          echo "URL length: ${#URL}"
          echo "KEY length: ${#KEY}"
          curl -sSf --max-time 30 --retry 3 --retry-delay 5 "$URL/rest/v1/Item?select=id&limit=1" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
