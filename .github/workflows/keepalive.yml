name: keepalive
on:
  schedule:
    - cron: "0 3 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          URL=$(printf '%s' "$SUPABASE_URL" | tr -d ' \r\n"')
          KEY=$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d ' \r\n"')
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Secret kosong, cek nama secret"; exit 1
          fi
          AUTH=()
          if [[ "$KEY" == eyJ* ]]; then
            AUTH=(-H "Authorization: Bearer $KEY")
          fi
          curl -sSf --max-time 30 --retry 3 --retry-delay 5 \
            "$URL/rest/v1/Item?select=id&limit=1" \
            -H "apikey: $KEY" "${AUTH[@]}"
          echo
          echo "OK: database tersentuh"
